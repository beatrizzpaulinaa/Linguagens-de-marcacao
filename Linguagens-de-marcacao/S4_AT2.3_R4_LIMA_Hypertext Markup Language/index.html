<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Produtos</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>

    <table>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Descrição</th>
                <th>Preço no PIX</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>PC Beast Edition v2.0</td>
                <td>Water Cooler, Ray Tracing e Overclock</td>
                <td>R$ 6.499,00</td>
            </tr>
            <tr>
                <td>Teclado Razer BlackWidow V3 Tenkeyless</td>
                <td>Mecânico, compacto e iluminação RGB</td>
                <td>R$ 429,00</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
